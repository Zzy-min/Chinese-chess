services:
  - type: web
    name: qiju-api
    runtime: node
    plan: starter
    rootDir: .
    autoDeploy: true
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @qiju/server build
    startCommand: corepack pnpm --filter @qiju/server exec tsx src/index.ts
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: QIJU_DB_PATH
        value: /var/data/qiju.sqlite
      - key: QIJU_COOKIE_SECRET
        generateValue: true
      - key: QIJU_COOKIE_SECURE
        value: "true"
    disk:
      name: qiju-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: qiju-web
    runtime: node
    plan: free
    rootDir: .
    autoDeploy: true
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @qiju/web build
    startCommand: corepack pnpm --filter @qiju/web exec next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_QIJU_API_BASE
        value: /backend
      - key: QIJU_BACKEND_HOSTPORT
        fromService:
          type: web
          name: qiju-api
          property: hostport
