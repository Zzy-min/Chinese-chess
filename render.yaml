services:
  - type: web
    name: xiangqi-web
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BIND_HOST
        value: 0.0.0.0
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx512m
      - key: XQ_GO_ENGINE_URL
        sync: false
  - type: web
    name: go-engine
    runtime: python
    rootDir: services/go-engine
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: GO_ENGINE_NAME
        value: KataGo
      - key: GO_ENGINE_RULES
        value: chinese
      - key: KATAGO_CMD
        sync: false
      - key: KATAGO_BIN
        sync: false
      - key: KATAGO_CONFIG
        sync: false
      - key: KATAGO_MODEL
        sync: false
