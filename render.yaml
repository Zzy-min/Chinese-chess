databases:
  - name: xiangqi-db
    databaseName: xiangqi
    user: xiangqi

services:
  - type: web
    name: xiangqi-web
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BIND_HOST
        value: 0.0.0.0
      - key: XQ_DATABASE_URL
        fromDatabase:
          name: xiangqi-db
          property: connectionString
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx512m
