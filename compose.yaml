name: xiangqi-stack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "18388"
      BIND_HOST: 0.0.0.0
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}
      XQ_DATABASE_URL: postgresql://db:5432/${POSTGRES_DB}
      XQ_DATABASE_USER: ${POSTGRES_USER}
      XQ_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      XQ_XIANGQI_ENGINE: PIKAFISH
      XQ_XIANGQI_PIKAFISH_CMD: /usr/local/bin/pikafish-engine
      XQ_GOMOKU_ENGINE: RAPFI
      XQ_GOMOKU_RAPFI_CMD: /usr/local/bin/rapfi-engine
    ports:
      - "127.0.0.1:18388:18388"
    expose:
      - "18388"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
